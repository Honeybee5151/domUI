<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="select-screen">
    <h1 class="visually-hidden">Choose your character</h1>

    <!-- Toolbar: find a character by name, and switch the layout -->
    <div class="toolbar" role="search">
      <label class="search">
        <span class="visually-hidden">Search characters</span>
        <svg class="search-icon" viewBox="0 0 8 8" aria-hidden="true">
          <rect x="1" y="0" width="4" height="1" /><rect x="0" y="1" width="1" height="4" />
          <rect x="5" y="1" width="1" height="4" /><rect x="1" y="5" width="4" height="1" />
          <rect x="5" y="5" width="1" height="1" /><rect x="6" y="6" width="2" height="2" />
        </svg>
        <input type="search" id="search" placeholder="Search by name or class" autocomplete="off" spellcheck="false" />
      </label>
      <button type="button" class="layout-toggle" id="layout-toggle" aria-pressed="false">
        <svg viewBox="0 0 8 8" aria-hidden="true">
          <rect x="0" y="1" width="4" height="6" /><rect x="5" y="1" width="3" height="2" />
          <rect x="5" y="5" width="3" height="2" />
        </svg>
        <span>Layout</span>
      </button>
      <button type="button" class="layout-toggle vault-toggle" id="vault-toggle" aria-pressed="false">
        <svg viewBox="0 0 8 8" aria-hidden="true">
          <rect x="0" y="1" width="8" height="2" /><rect x="0" y="4" width="8" height="4" />
          <rect x="3" y="3" width="2" height="2" fill="#0000" />
        </svg>
        <span>Vault</span>
      </button>
      <button type="button" class="layout-toggle create-toggle" id="create-toggle" aria-pressed="false">
        <svg viewBox="0 0 8 8" aria-hidden="true">
          <rect x="3" y="0" width="2" height="8" /><rect x="0" y="3" width="8" height="2" />
        </svg>
        <span>New character</span>
      </button>
      <span class="result-count" id="result-count" aria-live="polite"></span>
    </div>

    <!-- Cards are built from characters.js by app.js -->
    <div class="card-grid" id="card-grid" role="listbox" aria-label="Characters"></div>
    <p class="no-results" id="no-results" hidden>No characters match your search.</p>

    <!-- New character: pick a class with the slider, a name and a birthsign -->
    <section class="create-screen" id="create-screen" hidden aria-label="Create a new character">
      <div class="class-slider">
        <button type="button" class="slider-arrow" id="class-prev" aria-label="Previous class">
          <svg viewBox="0 0 8 8" aria-hidden="true"><rect x="4" y="0" width="2" height="2" /><rect x="2" y="2" width="2" height="2" /><rect x="0" y="3" width="2" height="2" /><rect x="2" y="4" width="2" height="2" /><rect x="4" y="6" width="2" height="2" /></svg>
        </button>
        <div class="class-track" id="class-track" role="listbox" aria-label="Class"></div>
        <button type="button" class="slider-arrow" id="class-next" aria-label="Next class">
          <svg viewBox="0 0 8 8" aria-hidden="true"><rect x="2" y="0" width="2" height="2" /><rect x="4" y="2" width="2" height="2" /><rect x="6" y="3" width="2" height="2" /><rect x="4" y="4" width="2" height="2" /><rect x="2" y="6" width="2" height="2" /></svg>
        </button>
      </div>
      <div class="class-dots" id="class-dots"></div>

      <form class="create-form" id="create-form" novalidate>
        <label class="create-field">
          <span class="create-label">Name</span>
          <input type="text" id="new-name" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Name your character" />
        </label>
        <div class="create-field">
          <span class="create-label" id="sign-label">Birthsign</span>
          <div class="sign-pick" id="sign-pick" role="radiogroup" aria-labelledby="sign-label"></div>
        </div>
        <p class="create-error" id="create-error" aria-live="polite"></p>
        <button type="submit" class="create-confirm">Create character</button>
      </form>
    </section>

    <!-- Vault mode: every character's card back on the left, the vault's chests on the
         right. Drag items between any slots, or tap an item and then tap where it goes. -->
    <section class="vault-screen" id="vault-screen" hidden aria-label="Vault">
      <div class="vault-chars" id="vault-chars"></div>
      <div class="vault-side">
        <div class="vault-chests" id="vault-chests"></div>
      </div>
    </section>
  </main>

  <!-- Double-click a card: enter the world with that character -->
  <div class="play-overlay" id="play-overlay" hidden>
    <div class="play-box" role="dialog" aria-modal="true" aria-labelledby="play-title">
      <p class="play-kicker">Entering the world</p>
      <h2 class="play-title" id="play-title"></h2>
      <p class="play-sub" id="play-sub"></p>
      <span class="play-bar" aria-hidden="true"><span></span></span>
      <button type="button" class="play-back" id="play-back">Back to characters</button>
    </div>
  </div>

  <!-- One card, cloned for each character -->
  <template id="card-template">
    <div class="card-unit">
    <button type="button" class="char-card" role="option" aria-selected="false">
      <!-- Right-click (or hold on a phone) flips the card between its front and back -->
      <span class="card-flip">
      <span class="card-inner">
        <span class="card-head">
          <span class="card-title">
            <span class="card-name"></span>
            <span class="card-level"><span class="level-label">Lv</span><span class="level-value"></span></span>
          </span>
          <span class="card-stats">
            <span class="card-hp"><span class="hp-label">HP</span><span class="hp-value"></span></span>
            <span class="card-sign"></span>
          </span>
        </span>
        <span class="card-art"></span>
        <span class="card-abilities"></span>
        <span class="card-foot"></span>
      </span>
      <span class="card-face-back"></span>
      </span>
    </button>
    <!-- Layout mode: the back of the card (equipment, inventory, backpack), to its right -->
    <div class="card-back" aria-hidden="true">
      <span class="back-inner">
        <span class="back-name"></span>
        <span class="back-section" data-section="equipment">
          <span class="back-heading">Equipment</span>
          <span class="back-grid"></span>
        </span>
        <span class="back-section" data-section="inventory">
          <span class="back-heading">Inventory</span>
          <span class="back-grid"></span>
        </span>
        <span class="back-section" data-section="backpack">
          <span class="back-heading">Backpack</span>
          <span class="back-grid"></span>
        </span>
      </span>
    </div>
    </div>
  </template>

  <script src="./birthsigns.js"></script>
  <script src="./items.js"></script>
  <script src="./art/screenshots/captions.js"></script>
  <script src="./characters.js"></script>
  <script src="./vault.js"></script>
  <script src="./app.js"></script>
</body>
</html>
