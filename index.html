  <style>
    /* Placeholder front page: the real one comes later */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #1d1b2e, #2d2440);
      color: #f4efe6;
      font-family: "Pixelify Sans", "Courier New", monospace;
      text-align: center;
      padding: 1rem;

    .enter {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.75rem 1.5rem;

      background: #f4efe6;
      box-shadow: 0 5px 0 #8f86c4;
      color: #1e1b2b;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .enter:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #8f86c4; }
    .enter:active { transform: translateY(3px); box-shadow: 0 2px 0 #8f86c4; }
